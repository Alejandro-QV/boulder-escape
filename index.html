<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T2 - Boulder Escape (Three.js)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
    }
    #info-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      user-select: none;
      z-index: 100;
    }
    #info-panel h2 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: #ffcc00;
    }
    #info-panel p {
      margin: 3px 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="info-panel">
    <h2>🎮 Boulder Escape (T2)</h2>
    <p><b>Controles:</b> Teclas <b>A / D</b> o <b>FLECHA IZQ / DER</b></p>
    <p><b>Estado:</b> Corriendo activamente</p>
  </div>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a0f00);
    scene.fog = new THREE.FogExp2(0x1a0f00, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 10);
    camera.lookAt(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffea9f, 0.8);
    dirLight.position.set(5, 12, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const ROAD_WIDTH = 6;
    const roadGeometry = new THREE.PlaneGeometry(ROAD_WIDTH, 100);
    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -30;
    road.receiveShadow = true;
    scene.add(road);
    const playerGroup = new THREE.Group();

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 1.2, 0.5), 
      new THREE.MeshStandardMaterial({ color: 0x0088ff })
    );
    body.position.y = 1;
    body.castShadow = true;
    playerGroup.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 16, 16), 
      new THREE.MeshStandardMaterial({ color: 0xffcc99 })
    );
    head.position.y = 1.9;
    head.castShadow = true;
    playerGroup.add(head);

    playerGroup.position.set(0, 0, 3);
    scene.add(playerGroup);
    function createCanvasStoneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#6e6e6e';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 3000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const radius = Math.random() * 3 + 1;
        const shade = Math.floor(Math.random() * 100) + 50;
        ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    const rockTexture = createCanvasStoneTexture();
    rockTexture.wrapS = THREE.RepeatWrapping;
    rockTexture.wrapT = THREE.RepeatWrapping;

    const boulder = new THREE.Mesh(
      new THREE.SphereGeometry(2.5, 32, 32),
      new THREE.MeshStandardMaterial({ map: rockTexture, roughness: 0.8 })
    );
    boulder.position.set(0, 2.5, -3);
    boulder.castShadow = true;
    scene.add(boulder);
    const obstacles = [];
    const obstacleGeo = new THREE.ConeGeometry(0.5, 1.2, 8);
    const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xcc3300, roughness: 0.5 });

    function createObstacle(zPos) {
      const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);
      const maxX = (ROAD_WIDTH / 2) - 0.8;
      obstacle.position.set((Math.random() * 2 - 1) * maxX, 0.6, zPos);
      obstacle.castShadow = true;
      scene.add(obstacle);
      obstacles.push(obstacle);
    }

    for (let z = -10; z > -60; z -= 10) {
      createObstacle(z);
    }
    const keys = { left: false, right: false };
    const moveSpeed = 0.15;
    const maxBound = (ROAD_WIDTH / 2) - 0.6;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
    });

    const speed = 0.25;

    function animate() {
      requestAnimationFrame(animate);

      if (keys.left && playerGroup.position.x > -maxBound) playerGroup.position.x -= moveSpeed;
      if (keys.right && playerGroup.position.x < maxBound) playerGroup.position.x += moveSpeed;

      boulder.rotation.x += 0.08;
      boulder.position.x += (playerGroup.position.x - boulder.position.x) * 0.05;

      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.position.z += speed;
        if (obs.position.z > 8) {
          obs.position.z = -50 - (Math.random() * 10);
          obs.position.x = (Math.random() * 2 - 1) * maxBound;
        }
      }

      playerGroup.position.y = Math.abs(Math.sin(Date.now() * 0.01)) * 0.15;
      camera.position.x = playerGroup.position.x * 0.3;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
  </script>
</body>
</html>
