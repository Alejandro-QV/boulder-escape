<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T2 - Boulder Escape (Three.js)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #0b1a09;
    }
    #info-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      user-select: none;
      z-index: 100;
    }
    #info-panel h2 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: #ffcc00;
    }
    #info-panel p {
      margin: 3px 0;
    }
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      background: rgba(20, 0, 0, 0.9);
      padding: 30px 50px;
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      display: none;
      box-shadow: 0 0 20px rgba(255,0,0,0.5);
      z-index: 200;
    }
    #game-over button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #ffcc00;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    #game-over button:hover {
      background-color: #ffd633;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="info-panel">
    <h2>🎮 Boulder Escape (T2)</h2>
    <p><b>Controles:</b> Teclas <b>A / D</b> o <b>FLECHA IZQ / DER</b></p>
    <p><b>Estado:</b> Corriendo activamente en la selva</p>
  </div>

  <div id="game-over">
    <h1 style="margin:0 0 10px 0; color:#ff3333;">¡GAME OVER!</h1>
    <p>Te has estrellado contra un obstáculo.</p>
    <button onclick="location.reload()">Jugar de Nuevo</button>
  </div>
  
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1a09);
    scene.fog = new THREE.FogExp2(0x0b1a09, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8.5, 7.5); 
    camera.lookAt(0, 0, -6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x2d4a22, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xd4ffcc, 0.9);
    dirLight.position.set(5, 12, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const ROAD_WIDTH = 6;
    const roadGeometry = new THREE.PlaneGeometry(ROAD_WIDTH, 120);
    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 });
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -30;
    road.receiveShadow = true;
    scene.add(road);

    const trees = [];
    
    function createTree(xPos, zPos) {
      const treeGroup = new THREE.Group();

      const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3, 6);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3219, roughness: 0.9 });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 1.5;
      trunk.castShadow = true;
      treeGroup.add(trunk);

      const leavesMat = new THREE.MeshStandardMaterial({ color: 0x14380f, roughness: 0.8 });
      for (let i = 0; i < 3; i++) {
        const leavesGeo = new THREE.SphereGeometry(1.2 - (i * 0.2), 8, 8);
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 3 + (i * 0.8);
        leaves.castShadow = true;
        treeGroup.add(leaves);
      }

      treeGroup.position.set(xPos, 0, zPos);
      scene.add(treeGroup);
      trees.push(treeGroup);
    }

    for (let z = 10; z > -80; z -= 8) {
      createTree(-ROAD_WIDTH/2 - 2 - Math.random() * 3, z);
      createTree(ROAD_WIDTH/2 + 2 + Math.random() * 3, z);
    }

    const playerGroup = new THREE.Group();

    const torso = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 1.0, 0.4), 
      new THREE.MeshStandardMaterial({ color: 0x2266ff, roughness: 0.4 })
    );
    torso.position.y = 1.1;
    torso.castShadow = true;
    playerGroup.add(torso);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 16, 16), 
      new THREE.MeshStandardMaterial({ color: 0xffd1b3, roughness: 0.6 })
    );
    head.position.y = 1.8;
    head.castShadow = true;
    playerGroup.add(head);

    const legMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
    const legLeft = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.3), legMat);
    legLeft.position.set(-0.2, 0.45, 0);
    legLeft.castShadow = true;
    playerGroup.add(legLeft);

    const legRight = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.3), legMat);
    legRight.position.set(0.2, 0.45, 0);
    legRight.castShadow = true;
    playerGroup.add(legRight);

    const armMat = new THREE.MeshStandardMaterial({ color: 0xffd1b3, roughness: 0.6 });
    const armLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.25), armMat);
    armLeft.position.set(-0.5, 1.1, 0);
    armLeft.castShadow = true;
    playerGroup.add(armLeft);

    const armRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.25), armMat);
    armRight.position.set(0.5, 1.1, 0);
    armRight.castShadow = true;
    playerGroup.add(armRight);

    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    function createCanvasStoneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#6e6e6e';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 3000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const radius = Math.random() * 3 + 1;
        const shade = Math.floor(Math.random() * 100) + 50;
        ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    const rockTexture = createCanvasStoneTexture();
    rockTexture.wrapS = THREE.RepeatWrapping;
    rockTexture.wrapT = THREE.RepeatWrapping;

    const rockGeo = new THREE.SphereGeometry(1.8, 32, 32);
    const rockMat = new THREE.MeshStandardMaterial({ map: rockTexture, roughness: 0.8 });
    const boulder = new THREE.Mesh(rockGeo, rockMat);
    boulder.position.set(0, 1.8, 4.0);
    boulder.castShadow = true;
    scene.add(boulder);

    const obstacles = [];
    const obstacleGeo = new THREE.ConeGeometry(0.5, 1.2, 8);
    const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xcc3300, roughness: 0.5 });

    function createObstacle(zPos) {
      const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);
      const maxX = (ROAD_WIDTH / 2) - 0.8;
      obstacle.position.set((Math.random() * 2 - 1) * maxX, 0.6, zPos);
      obstacle.castShadow = true;
      scene.add(obstacle);
      obstacles.push(obstacle);
    }

    for (let z = -35; z > -95; z -= 12) {
      createObstacle(z);
    }

    const keys = { left: false, right: false };
    const moveSpeed = 0.15;
    const maxBound = (ROAD_WIDTH / 2) - 0.6;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
    });

    const speed = 0.25;
    let isGameOver = false;

    function animate() {
      if (isGameOver) return;
      requestAnimationFrame(animate);

      if (keys.left && playerGroup.position.x > -maxBound) playerGroup.position.x -= moveSpeed;
      if (keys.right && playerGroup.position.x < maxBound) playerGroup.position.x += moveSpeed;

      boulder.rotation.x += 0.05; 
      boulder.position.z = playerGroup.position.z + 4.0; 
      boulder.position.x += (playerGroup.position.x - boulder.position.x) * 0.1;

      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.position.z += speed;

        const dx = playerGroup.position.x - obs.position.x;
        const dz = playerGroup.position.z - obs.position.z;
        const distance = Math.sqrt(dx * dx + dz * dz);

        if (distance < 0.7) {
          isGameOver = true;
          document.getElementById('game-over').style.display = 'block';
          return;
        }

        if (obs.position.z > 8) {
          obs.position.z = -70 - (Math.random() * 15);
          obs.position.x = (Math.random() * 2 - 1) * maxBound;
        }
      }

      for (let i = 0; i < trees.length; i++) {
        const t = trees[i];
        t.position.z += speed;
        if (t.position.z > 10) {
          t.position.z = -80;
        }
      }

      const time = Date.now() * 0.015;
      playerGroup.position.y = Math.abs(Math.sin(time)) * 0.1;
      legLeft.position.z = Math.sin(time) * 0.3;
      legRight.position.z = -Math.sin(time) * 0.3;
      armLeft.position.z = -Math.sin(time) * 0.3;
      armRight.position.z = Math.sin(time) * 0.3;

      camera.position.x = playerGroup.position.x * 0.3;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
